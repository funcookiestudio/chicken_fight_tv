name = "chicken-fight-live"
main = "worker.mjs"
compatibility_date = "2025-01-01"

# opcional: só aceita conexões vindas do seu site (separe por vírgula)
# [vars]
# ORIGINS = "https://SEU-USUARIO.github.io"

[[durable_objects.bindings]]
name = "CANAL"
class_name = "Canal"

[[durable_objects.bindings]]
name = "WALLET"
class_name = "Wallet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby", "Wallet"]

# v2: entra a emissora (Canal); saem as salas da Arena (Room e Lobby)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Canal"]
deleted_classes = ["Room", "Lobby"]
